name: Development Test

on:
  workflow_dispatch:
    inputs:
      run_windows:
        description: '运行 Windows'
        required: false
        type: boolean
        default: true
      run_macos_aarch64:
        description: '运行 macOS aarch64'
        required: false
        type: boolean
        default: true
      run_windows_arm64:
        description: '运行 Windows ARM64'
        required: false
        type: boolean
        default: true
      run_linux_amd64:
        description: '运行 Linux amd64'
        required: false
        type: boolean
        default: true
      publish_run_id:
        description: 'Existing run containing a verified installer artifact'
        required: false
        type: string
      publish_release_tag:
        description: 'Existing release tag for a dedicated-line build'
        required: false
        type: string
      publish_expected_sha256:
        description: 'Verified installer SHA-256 required when publishing an existing run'
        required: false
        type: string
      publish_artifact_name:
        description: 'Installer artifact to transfer to the existing release'
        required: false
        type: choice
        default: macos-aarch64
        options:
          - macos-aarch64
          - windows
          - windows-arm64

permissions: write-all
env:
  TAG_NAME: deploytest
  TAG_CHANNEL: DeployTest
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  publish_existing_installer:
    if: inputs.publish_release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.publish_run_id }}
      RELEASE_TAG: ${{ inputs.publish_release_tag }}
      EXPECTED_SHA256: ${{ inputs.publish_expected_sha256 }}
      ARTIFACT_NAME: ${{ inputs.publish_artifact_name }}
    steps:
      - name: Upload verified installer artifact to existing release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^dedicated-line-v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$ARTIFACT_NAME" == macos-aarch64 || "$ARTIFACT_NAME" == windows || "$ARTIFACT_NAME" == windows-arm64 ]]
          release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          upload_options=()
          if [[ "$release_is_draft" == true ]]; then
            upload_options+=(--clobber)
          else
            [[ "$release_is_draft" == false ]]
            [[ "$(gh run view "$SOURCE_RUN_ID" --json conclusion --jq .conclusion)" == success ]]
            [[ "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" == "$(gh run view "$SOURCE_RUN_ID" --json headSha --jq .headSha)" ]]
          fi
          gh run download "$SOURCE_RUN_ID" --name "$ARTIFACT_NAME" --dir package
          shopt -s nullglob
          installers=(package/*.dmg package/*.exe)
          [[ ${#installers[@]} -eq 1 ]]
          installer="${installers[0]}"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$installer" | sha256sum --check -
          name="$(basename "$installer")"
          name="${name// /.}"
          checksum="package/$name.sha256"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$name" > "$checksum"
          gh release upload "$RELEASE_TAG" "$installer" "$checksum" "${upload_options[@]}"

  dev:
    if: inputs.publish_release_tag == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            id: windows
            input: run_windows
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            id: macos-aarch64
            input: run_macos_aarch64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            id: windows-arm64
            input: run_windows_arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            id: linux-amd64
            input: run_linux_amd64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip job if not selected
        if: github.event.inputs[matrix.input] != 'true'
        run: echo "Job ${{ matrix.id }} skipped as requested"

      - name: Checkout Repository
        if: github.event.inputs[matrix.input] == 'true'
        uses: actions/checkout@v7

      - name: Install Rust Stable
        if: github.event.inputs[matrix.input] == 'true'
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event.inputs[matrix.input] == 'true' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/feature/dedicated-line') }}
          cache-on-failure: true
          prefix-key: 'v1-rust'
          key: 'rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04' && github.event.inputs[matrix.input] == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        if: github.event.inputs[matrix.input] == 'true'
        with:
          run_install: false

      - name: Install Node
        if: github.event.inputs[matrix.input] == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: 'pnpm'

      - name: Pnpm Cache
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: 'pnpm-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          restore-keys: |
            pnpm-shared-stable-${{ matrix.os }}-${{ matrix.target }}
          lookup-only: true

      - name: Test DMG verification before compiling
        if: matrix.id == 'macos-aarch64' && github.event.inputs[matrix.input] == 'true'
        shell: bash
        run: |
          fixture=$(mktemp -d "$RUNNER_TEMP/cvr-verifier.XXXXXX")
          app="$fixture/Fixture.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/resources"
          printf '%s\n' '#include <stdio.h>' 'int main(void) { puts("verifier fixture"); return 0; }' > "$RUNNER_TEMP/cvr-verifier.c"
          clang -arch arm64 "$RUNNER_TEMP/cvr-verifier.c" -o "$app/Contents/MacOS/clash-verge"
          for name in verge-mihomo verge-mihomo-alpha; do
            cp "$app/Contents/MacOS/clash-verge" "$app/Contents/MacOS/$name"
          done
          for name in clash-verge-service clash-verge-service-install clash-verge-service-uninstall; do
            cp "$app/Contents/MacOS/clash-verge" "$app/Contents/Resources/resources/$name"
          done
          plutil -create xml1 "$app/Contents/Info.plist"
          plutil -insert CFBundleExecutable -string clash-verge "$app/Contents/Info.plist"
          plutil -insert CFBundleIdentifier -string local.cvr.verifier "$app/Contents/Info.plist"
          plutil -insert CFBundlePackageType -string APPL "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          hdiutil create -volname VerifierFixture -srcfolder "$fixture" -format UDZO "$RUNNER_TEMP/cvr-verifier.dmg"
          node scripts/verify-macos-bundle.mjs "$RUNNER_TEMP/cvr-verifier.dmg" arm64

      - name: Pnpm install and check
        if: github.event.inputs[matrix.input] == 'true'
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Release ${{ env.TAG_CHANNEL }} Version
        if: github.event.inputs[matrix.input] == 'true'
        run: pnpm release-version ${{ env.TAG_NAME }}

      - name: Add Rust Target
        if: github.event.inputs[matrix.input] == 'true'
        run: |
          # Ensure cross target is installed for the pinned toolchain; fallback without explicit toolchain if needed
          rustup target add ${{ matrix.target }} --toolchain 1.99.0 || rustup target add ${{ matrix.target }}
          rustup target list --installed
          echo "Rust target ${{ matrix.target }} installed."

      - name: Check dedicated line compatibility
        if: matrix.id == 'macos-aarch64' && github.event.inputs[matrix.input] == 'true'
        run: |
          pnpm web:build
          pnpm test
          cargo test --locked --release --target ${{ matrix.target }} -p clash-verge --lib dedicated_line

      - name: Tauri build
        if: github.event.inputs[matrix.input] == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }} -b ${{ matrix.bundle }}

      - name: Verify Apple Silicon bundle
        if: matrix.id == 'macos-aarch64' && github.event.inputs[matrix.input] == 'true'
        run: |
          for installer in target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            node scripts/verify-macos-bundle.mjs "$installer" arm64
          done

      - name: Upload Artifacts (macOS)
        if: ${{ !cancelled() && matrix.os == 'macos-latest' && github.event.inputs[matrix.input] == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-aarch64
          archive: true
          compression-level: 0
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/dmg/*.sha256
          if-no-files-found: error

      - name: Hash Windows installer
        if: matrix.os == 'windows-latest' && github.event.inputs[matrix.input] == 'true'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path 'target/${{ matrix.target }}/release/bundle/nsis/*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = $hash + '  ' + $installer.Name + [char]10
          [IO.File]::WriteAllText($installer.FullName + '.sha256', $checksum, [Text.UTF8Encoding]::new($false))
          Write-Output $checksum

      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest' && github.event.inputs[matrix.input] == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}
          archive: true
          compression-level: 0
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.sha256
          if-no-files-found: error

      - name: Upload Artifacts (Linux)
        if: matrix.os == 'ubuntu-22.04' && github.event.inputs[matrix.input] == 'true'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
