name: My Unsigned Build

# 免签名三平台构建：不依赖任何签名 secret（关闭更新器产物 + 不做苹果签名）
# 手动触发；产物发布到 mybuild 这个 prerelease，供下载分发。
on:
  workflow_dispatch:

permissions: write-all
env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (feature branch)
        uses: actions/checkout@v6
        with:
          ref: feature/dedicated-line

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust'
          key: 'mybuild-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: '. -> target'
          cache-all-crates: true

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'

      - name: Install & prebuild
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Disable updater artifacts (unsigned build)
        run: node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2));console.log('createUpdaterArtifacts disabled')"

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }} --toolchain 1.95.0 || rustup target add ${{ matrix.target }}

      - name: Tauri build (unsigned, no secrets)
        uses: tauri-apps/tauri-action@v0
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }} -b ${{ matrix.bundle }}

      - name: Upload to Release (mybuild)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mybuild
          name: 'Clash Verge 专线版（未签名）'
          body: '专线代理定制版，未做代码签名。macOS 首次打开若被拦：sudo xattr -cr "/Applications/Clash Verge.app"；Windows SmartScreen 选“更多信息→仍要运行”。'
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
